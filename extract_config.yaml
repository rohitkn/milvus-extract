# Milvus extract tool configuration
# Use with: python extract.py -f extract_config.yaml  (or: click run extract.py -f extract_config.yaml)

extract:
  # Database name (string, mandatory). Default: 'default'
  database: default

  # Collection name (string, mandatory). Default: ''
  collection: ''

  # Milvus endpoint (string, mandatory). Default: https://localhost:19530
  endpoint: https://localhost:19530

  # API key / token for Milvus (string, mandatory). Default: 'root:Milvus'
  #api_key: 'root:Milvus'
  api_key: '57b701da57c8b81dcb2f632c3794ddb065c72f7284cae6af106d0662fb4715f2c1cc26b4f49a53fe43781fe79e5890268e0b9419'

  # Batch size for query_iterator (int, 1–16384). Default: 2000
  buffer: 2000

  # Scalar filter expression (string). Empty = no filtering. Default: ''
  filter_expression: ''

  # Export format: 'JSON' or 'PARQUET' (string). Default: JSON
  export_file_type: JSON

  # Output destination: file:///path/to/file
  # Output destination or s3://bucket/remote/path -- NOTE: bucket is not needed if cloud_storage_params.storage_root is set
  output_location: file:///tmp/milvus_export

  # Cloud storage (S3-compatible) parameters
  cloud_storage_params:
    # Endpoint (string). Default: 'localhost:9000' for minio
    # use s3.amazonaws.com for AWS
    # use storage.googleapis.com for Google Cloud
    endpoint: 'localhost:9000'  
    # Access key (string, mandatory)
    access_key: 'minioadmin'
    # Secret key (string, mandatory)
    secret_key: 'minioadmin'
    # Storage root / bucket (string, mandatory). Default: 'a-bucket'
    storage_root: 'a-bucket'
