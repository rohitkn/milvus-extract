# Milvus connection credentials
# Use with: python extract.py -i connection.yaml

connect:
  # Milvus endpoint (string, mandatory). Default: https://localhost:19530
  endpoint: https://in01-cdc47638b1fecdf.gcp-us-west1.vectordb.zillizcloud.com:443
  
  # API key / token for Milvus (string, mandatory). Default: 'root:Milvus' will be read from .env file.
  cloud_storage_params:
